{{define "list"}}{{if not .Data.Records}}<p class="empty">No audit records.</p>{{else}}<table>
<thead><tr><th>ID</th><th>Time</th><th>Action</th><th>Target</th><th>Result</th></tr></thead>
<tbody>{{range .Data.Records}}<tr class="result-{{.Result}}">
<td>{{.ID}}</td><td>{{ms .At}}</td><td>{{.Action}}</td><td><code>{{.Target}}</code></td>
<td>{{.Result}}{{if .Reason}}<br><small>{{.Reason}}</small>{{end}}</td>
</tr>{{end}}</tbody></table>{{end}}
{{if .Data.Next}}<p><a href="/dashboard/audit{{query "before" (printf "%d" .Data.Next)}}">Older records</a></p>{{end}}{{end}}
