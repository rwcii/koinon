name: Native public installation evidence
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-installation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: systemd
          - os: macos-latest
            backend: launchd
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/test-native-install.py --run-isolated-job --backend "${{ matrix.backend }}" --output "$RUNNER_TEMP/koinon-installation-evidence/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.backend }}-installation-evidence
          path: ${{ runner.temp }}/koinon-installation-evidence/result.json
          if-no-files-found: error
