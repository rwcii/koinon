name: Test reliability repeat
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  macos-repeat:
    if: github.head_ref == 'fix/test-process-waits'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KOINON_TEST_TIMEOUT_SCALE: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repeat migrated timing tests five times under one watchdog
        shell: bash
        run: |
          modules=()
          for iteration in {1..5}; do
            modules+=(test_notification_runtime test_session test_session_supervisor)
          done
          python tests/run.py -v "${modules[@]}"
