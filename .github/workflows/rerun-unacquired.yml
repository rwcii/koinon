name: Rerun jobs that no runner acquired

# A GitHub-hosted macOS job can wait for a runner until GitHub cancels it (#630). When no runner
# acquired any failed job of a Tests or Native Go lifecycle evidence run, its failed jobs run
# again, at most twice. A run with another failure is not rerun, and the release account still
# lists each failed attempt (WDR 004, Decision 6). GitHub runs workflow_run workflows from the
# default branch.
on:
  workflow_run:
    workflows: ["Tests", "Native Go lifecycle evidence"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the default branch's own script runs with the write token, never the triggering
      # run's head or its artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Rerun the failed jobs when no runner acquired them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: sh scripts/rerun-unacquired.sh
