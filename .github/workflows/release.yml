name: Release binaries
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'cmd/koinon/lifecycle.go', 'scripts/homebrew-*.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the four CGO-free binaries, their Homebrew bottles and the checksums
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::12}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$version -X main.commit=$GITHUB_SHA" \
              -o "dist/koinon-${target//\//-}" ./cmd/koinon
          done
          # Off a tag, the bottles carry v0.0.0 for the homebrew-check job.
          bottles="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || bottles=v0.0.0
          scripts/homebrew-bottles.sh "$bottles" dist
          (cd dist && sha256sum koinon-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Check the build's own version
        run: dist/koinon-linux-amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: koinon-binaries
          path: dist/
          if-no-files-found: error
  # Homebrew pours the bottle from a local tap, so the release's bottles are proven before they
  # are published: a bottle that does not pour would make Homebrew build, which needs the
  # developer tools on macOS (#384).
  homebrew-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: koinon-binaries
          path: dist
      - name: Install the formula from its bottle and check the version
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag=v0.0.0
          brew tap-new --no-git koinon/check
          scripts/homebrew-formula.sh "$tag" dist/SHA256SUMS "file://$PWD/dist" > "$(brew --repository koinon/check)/Formula/koinon.rb"
          brew install koinon/check/koinon
          brew info --json=v2 koinon/check/koinon | jq -e '.formulae[0].installed[0].poured_from_bottle == true'
          "$(brew --prefix)/bin/koinon" version | grep -F "\"commit\": \"$GITHUB_SHA\""
  publish:
    needs: [build, homebrew-check]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Checkout stores the tag as a lightweight ref, which gives --notes-from-tag the commit message.
      - name: Fetch the annotated tag for the release notes
        run: git fetch --no-tags --depth=1 --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: koinon-binaries
          path: dist
      - name: Attach the binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Koinon $GITHUB_REF_NAME" --notes-from-tag
          fi
  homebrew:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: koinon-binaries
          path: dist
      - name: Write the formula and push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 0600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:rwcii/homebrew-koinon.git tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > tap/Formula/koinon.rb
          cd tap
          git add Formula/koinon.rb
          if git diff --cached --quiet; then
            echo "The formula is already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "koinon $GITHUB_REF_NAME"
          git push origin HEAD:main
