name: Native public upgrade evidence
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        kind: [memory, session]
        initial_state: [running, stopped, deactivated]
        include:
          - os: ubuntu-latest
            backend: systemd
          - os: macos-latest
            backend: launchd
          - os: ubuntu-latest
            backend: systemd
            kind: combined
            initial_state: running
          - os: macos-latest
            backend: launchd
            kind: combined
            initial_state: running
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/test-native-upgrade.py --run-isolated-job --backend "${{ matrix.backend }}" --kind "${{ matrix.kind }}" --initial-state "${{ matrix.initial_state }}" --interrupt-phase all
