name: Native session lifecycle evidence
on:
  pull_request:
    branches: [develop]
    # Agent-process files are not installed and no test reads them; see
    # tests/test_ci_scope.py.
    paths-ignore:
      - 'agents/**'
      - 'docs/sprints/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
  push:
    branches: [develop, main]
    paths-ignore:
      - 'agents/**'
      - 'docs/sprints/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  launchd-session:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/test-native-session.py --run-isolated-job --backend launchd --output "$RUNNER_TEMP/koinon-session-evidence/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchd-session-evidence
          path: ${{ runner.temp }}/koinon-session-evidence/result.json
          if-no-files-found: error
