# Temporary: the test reliability sprint's bounded reproduction attempt on macOS
# (docs/sprints/2026-09-22-test-reliability/chunks/04-observed-hangs.md). Removed before merge.
name: Hang reproduction
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KOINON_TEST_TIMEOUT_SCALE: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: test_work_activation (#63)
        run: python tests/run.py -v test_work_activation
      - name: test_upgrade_probe with test_upgrade_manual
        if: success()
        run: python tests/run.py -v test_upgrade_probe test_upgrade_manual
